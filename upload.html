<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload | HobbyNest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1 style="text-align:center; padding:20px; color:#ff6600;">
        📤 Upload Your Creativity
    </h1>
</header>

<section style="max-width:600px; margin:40px auto; background:white; padding:30px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.2);">

    <h2 style="text-align:center;">Share Your Hobby 🌸</h2>

    <br>

    <form>

        <label><b>Artwork Title</b></label><br>
        <input type="text" placeholder="Enter Artwork Title" style="width:100%; padding:10px;"><br><br>

        <label><b>Category</b></label><br>
        <select style="width:100%; padding:10px;">
            <option>Photography 📸</option>
            <option>Art 🎨</option>
            <option>Painting 🖌️</option>
            <option>Crafts ✂️</option>
            <option>Nature 🌿</option>
        </select>

        <br><br>

        <label><b>Upload Image</b></label><br>
        <input type="file">

        <br><br>

        <label><b>Description</b></label><br>
        <textarea rows="5" style="width:100%;" placeholder="Write about your creativity..."></textarea>

        <br><br>

        <button type="submit">🚀 Upload</button>

    </form>

</section>

<div style="text-align:center; margin-bottom:40px;">
    <a href="index.html">
        <button>🏠 Back to Home</button>
    </a>
</div>

</body>
</html>
